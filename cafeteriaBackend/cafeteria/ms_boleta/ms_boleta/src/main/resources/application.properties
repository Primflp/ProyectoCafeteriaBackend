spring.application.name=ms_boleta

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/boleta}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:barawoken}

server.port=${PORT:8083}

ms.producto.url=${MS_PRODUCTO_URL:http://localhost:8082/api/v2}
ms.usuario.url=${MS_USUARIO_URL:http://localhost:8081/api/v2}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl